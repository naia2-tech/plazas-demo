<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E9E1D6">
<title>ORE · zeramika tailerra · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* ORE — estudio ficticio. Esencia: calma, barro, letras en mayúscula espaciadas, etiquetas entre paréntesis. */
:root{
  --shell:#E9E1D6; --sand:#EFE8DF; --paper:#FAF7F2; --line:#E2D8CC; --ink:#3A2B21; --muted:#8B7A6B;
  --clay:#B5774F; --clay-soft:#F2E4D8; --sage:#7F8F72; --sage-soft:#E5EADD; --cocoa:#4A3427;
  --ok:#5E8A5A; --ok-soft:#E3EEDF; --warn:#C27A2C; --warn-soft:#F7E7D3; --gold:#C49A4E;
  --bezel:#1C1612;
  --f-d:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-b:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#F4EEE6 0%,var(--shell) 60%) fixed;color:var(--ink);font:15px/1.5 var(--f-b);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.ph{background:linear-gradient(135deg,#D9C7B5,#BFA38A)}
.ph img{width:100%;height:100%;object-fit:cover}

/* ---------- shell ---------- */
.shell{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;flex-wrap:wrap}
.bar .brand{display:flex;align-items:baseline;gap:10px}
@media (max-width:900px) and (min-width:601px){.bar .seg{order:3;margin:0 auto}}
.wm{font-family:var(--f-d);font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.bar .wm{font-size:1.5rem}
.paren{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;box-shadow:0 6px 20px -12px rgba(74,52,39,.35)}
.seg button{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button svg{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--cocoa);color:var(--paper)}
.right{display:flex;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.lang button{padding:5px 11px;border-radius:999px;font-size:.75rem;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.by{font-size:.72rem;color:var(--muted);text-align:right;line-height:1.3}
.by b{color:var(--ink);font-weight:700;letter-spacing:.04em}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:36px;padding:0 22px 18px;position:relative}
.side{width:250px;display:flex;flex-direction:column;gap:14px;flex:none}
.side h3{font-family:var(--f-d);font-size:1.7rem;font-weight:500;font-style:italic;margin:0;line-height:1.1}
.tries{display:flex;flex-direction:column;gap:6px}
.try{display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.86rem;font-weight:600;transition:transform .15s}
.try:active{transform:scale(.98)}
.try i{font-style:normal;width:28px;height:28px;border-radius:9px;background:var(--clay-soft);display:grid;place-items:center;flex:none;font-size:.95rem}
.sync{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start;background:var(--sage-soft);border-radius:12px;padding:10px 12px}
.sync svg{width:18px;height:18px;flex:none;color:var(--sage);margin-top:1px}
.points{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.points li{font-size:.88rem;display:grid;grid-template-columns:auto 1fr;gap:10px}
.points li b{display:block;font-weight:700}
.points li span{color:var(--muted)}
.points .n{font-family:var(--f-d);font-size:1.3rem;font-style:italic;color:var(--clay);line-height:1}
.foot{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:.68rem;color:var(--muted)}
.fitwrap{position:relative;flex:none}
.device{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--bezel);box-shadow:0 40px 80px -30px rgba(40,25,15,.55),inset 0 0 0 1.5px #3a302a}
.phone{border-radius:58px;padding:12px}
.phone .screen{width:390px;height:844px;border-radius:46px}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:30}
.tablet{border-radius:38px;padding:20px}
.tablet .screen{border-radius:20px}
.cam{position:absolute;width:8px;height:8px;border-radius:50%;background:#2c2622;top:6px;left:50%;transform:translateX(-50%)}
.screen{background:var(--paper);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:1060px){.side.right-col{display:none}}
@media (max-width:820px){.side{display:none}}
@media (max-width:600px){.seg button span.l{display:none}}

/* no frames on phone-sized viewports */
body.nofr{overflow:auto}
body.nofr .stage{padding:0;display:block}
body.nofr .fitwrap{width:100%!important;height:auto!important}
body.nofr .device{position:relative;transform:none!important;background:none;box-shadow:none;padding:0;border-radius:0}
body.nofr .island,body.nofr .cam{display:none}
body.nofr .phone .screen{width:100%;height:calc(100dvh - var(--hh,64px));border-radius:0}
body.nofr .tablet .screen{width:100%!important;height:auto!important;min-height:calc(100dvh - var(--hh,64px));border-radius:0}
body.nofr .foot{display:none}

/* ---------- student app ---------- */
.sbar{height:54px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px 36px;font-weight:700;font-size:.82rem}
body.nofr .sbar{display:none}
.sbar .sig{display:flex;gap:5px;align-items:center}
.sbar .sig i{display:inline-block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.sbar .sig i::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.abody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.abody::-webkit-scrollbar{display:none}
.pad{padding:6px 20px 24px;display:flex;flex-direction:column;gap:14px}
.atop{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 0}
.atop .wm{font-size:1.15rem}
.ibtn{width:40px;height:40px;border-radius:14px;background:var(--sand);display:grid;place-items:center;position:relative}
.ibtn svg{width:21px;height:21px}
.ibtn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--clay);color:#fff;font:700 .66rem/18px var(--f-b);font-style:normal;text-align:center;padding:0 4px}
.hello h1,.h1{font-family:var(--f-d);font-weight:500;font-size:2.15rem;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em}
.h1 em,.hello h1 em{color:var(--clay)}
.card{background:var(--sand);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.dark{background:var(--cocoa);color:var(--paper)}
.card.dark .paren,.card.dark .muted{color:#D8C6B6}
.muted{color:var(--muted)}
.lbl{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card.dark .lbl{color:#CDB8A6}
.big{font-family:var(--f-d);font-size:1.6rem;line-height:1.1;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row>*{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 16px;font-weight:700;font-size:.9rem;background:var(--ink);color:var(--paper);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.light{background:var(--paper);color:var(--ink)}
.btn.clay{background:var(--clay);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{padding:8px 12px;font-size:.8rem;border-radius:12px}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap;background:var(--paper);color:var(--ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.clay{background:var(--clay-soft);color:var(--clay)} .chip.sage{background:var(--sage-soft);color:var(--sage)} .chip.gold{background:#F4E9D3;color:#9A7430}
.ready{display:flex;align-items:center;gap:12px;background:var(--ok-soft);border-radius:22px;padding:10px;text-align:left;width:100%;position:relative;overflow:hidden}
.ready .ph{width:62px;height:62px;border-radius:16px;overflow:hidden;flex:none}
.ready b{display:block;color:var(--ok);font-size:.95rem}
.ready small{display:block;color:var(--ink);font-size:.8rem}
.ready .grow{flex:1;min-width:0}
.ready svg{width:20px;height:20px;color:var(--ok)}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.kiln .temp{font-family:var(--f-d);font-size:2rem;line-height:1}
.flame{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,#F3B26B,#C95F2E);color:#fff;animation:glow 2s ease-in-out infinite}
.flame svg{width:20px;height:20px}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(214,124,60,.18)}}
.prog{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#E9A25F,#C95F2E);transition:width .4s}
.note{display:flex;gap:12px;align-items:flex-start}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;background:var(--clay-soft);color:var(--clay)}
.av.s{width:30px;height:30px;font-size:.72rem}
.av.m{background:var(--cocoa);color:var(--paper)}
.ptile{display:flex;gap:12px;align-items:center;background:var(--sand);border-radius:20px;padding:10px;text-align:left;width:100%}
.ptile .ph{width:70px;height:70px;border-radius:15px;overflow:hidden;flex:none}
.ptile .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ptile b{font-size:.95rem}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--clay)}
.dots i.ok{background:var(--ok)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.filters button{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted);background:var(--paper)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sw{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);vertical-align:-3px}
/* piece detail */
.hero{position:relative;height:330px;flex:none}
.hero .ph{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 60%,rgba(30,20,12,.55))}
.hero .back{position:absolute;top:10px;left:16px;z-index:2;width:40px;height:40px;border-radius:14px;background:rgba(250,247,242,.9);display:grid;place-items:center}
.hero .back svg{width:20px;height:20px}
.hero .cap{position:absolute;left:20px;right:20px;bottom:16px;z-index:2;color:#fff}
.hero .cap .h1{color:#fff}
.tl{display:flex;flex-direction:column;gap:0;padding-left:6px}
.tl .st{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;position:relative;padding-bottom:16px}
.tl .st::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl .st:last-child::before{display:none}
.tl .st.done::before{background:var(--clay)}
.tl .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;z-index:1}
.tl .st.done .b{background:var(--clay);border-color:var(--clay);color:#fff}
.tl .st.now .b{border-color:var(--clay);box-shadow:0 0 0 5px var(--clay-soft)}
.tl .b svg{width:12px;height:12px}
.tl .t b{display:block;font-size:.9rem}
.tl .t small{color:var(--muted);font-size:.78rem}
.tl .d{font-size:.75rem;color:var(--muted);white-space:nowrap}
.glazes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gz{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;border:1.5px solid transparent;font-size:.72rem;font-weight:600;text-align:center}
.gz i{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.18),inset 0 4px 8px rgba(255,255,255,.35)}
.gz[aria-pressed="true"]{border-color:var(--ink);background:var(--paper)}
/* community */
.post{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.post .hd{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .hd b{font-size:.88rem;display:block}
.post .hd small{font-size:.74rem;color:var(--muted)}
.post .img{aspect-ratio:1/1;position:relative}
.post .img .ph{position:absolute;inset:0}
.post .badge{position:absolute;top:10px;left:10px;z-index:2}
.post .bd{padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.post .txt{font-size:.9rem}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.re{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--sand);font-size:.85rem;font-weight:700;transition:transform .15s}
.re small{font-size:.75rem;color:var(--muted);font-weight:700}
.re[aria-pressed="true"]{background:var(--clay-soft);box-shadow:inset 0 0 0 1.5px var(--clay)}
.re[aria-pressed="true"] small{color:var(--clay)}
.re.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}}
.cmts{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.cm{display:flex;gap:8px;font-size:.84rem;align-items:flex-start}
.cm b{font-weight:700}
.cm .bub{background:var(--sand);border-radius:4px 14px 14px 14px;padding:7px 10px}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:none;font-size:.76rem;font-weight:600;padding:7px 10px;border-radius:999px;border:1px dashed var(--clay);color:var(--clay)}
.cin{display:flex;gap:8px}
.cin input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sand);border-radius:14px;padding:10px 12px;font-size:.85rem}
.cin button{width:42px;border-radius:14px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.cin button svg{width:18px;height:18px}
.upl{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--clay);border-radius:22px;padding:14px;background:var(--clay-soft);cursor:pointer}
.upl i{font-style:normal;width:44px;height:44px;border-radius:14px;background:var(--clay);color:#fff;display:grid;place-items:center;flex:none}
.upl i svg{width:22px;height:22px}
.upl b{display:block;font-size:.92rem}
.upl small{font-size:.78rem;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:.66rem;font-weight:700;color:var(--muted);padding:4px 0}
.cal .dd{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.82rem;font-weight:600;position:relative}
.cal .dd.today{background:var(--ink);color:var(--paper)}
.cal .dd .m{display:flex;gap:2px;position:absolute;bottom:5px}
.cal .dd .m i{width:5px;height:5px;border-radius:50%}
.cal .dd.past{color:#bdb0a3}
.ws{display:flex;gap:12px;align-items:center;background:var(--sand);border-radius:20px;padding:10px}
.ws .date{width:54px;height:58px;border-radius:14px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.ws .date b{font-family:var(--f-d);font-size:1.5rem;line-height:1}
.ws .date small{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ws .grow{flex:1;min-width:0}
.ws .grow b{display:block;font-size:.9rem}
.ws .grow small{font-size:.76rem;color:var(--muted)}
.seats{display:flex;gap:3px;margin-top:5px}
.seats i{width:9px;height:9px;border-radius:50%;background:var(--clay)}
.seats i.free{background:transparent;box-shadow:inset 0 0 0 1.5px var(--clay)}
.gift{background:linear-gradient(135deg,var(--cocoa),#6B4A36);color:var(--paper);border-radius:24px;padding:18px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;position:relative;overflow:hidden}
.gift b{font-family:var(--f-d);font-size:1.45rem;font-weight:500;display:block;line-height:1.1}
.gift small{color:#D8C6B6;font-size:.8rem}
.gift .bow{font-size:2rem}
/* profile */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sand);border-radius:18px;padding:12px 8px;text-align:center}
.stat b{font-family:var(--f-d);font-size:1.8rem;line-height:1;display:block}
.stat small{font-size:.7rem;color:var(--muted);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:.66rem;font-weight:600;line-height:1.2}
.bdg i{font-style:normal;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:radial-gradient(circle at 35% 30%,#fff,var(--clay-soft) 60%);box-shadow:inset 0 0 0 2px #E7CBB4}
.bdg.lock{opacity:.4;filter:grayscale(1)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.set:last-child{border:0}
.tg{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg[aria-pressed="true"]{background:var(--ok)}
.tg[aria-pressed="true"]::after{left:21px}
/* tabbar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 28px;background:rgba(250,247,242,.96);border-top:1px solid var(--line)}
body.nofr .tabbar{padding-bottom:max(10px,env(safe-area-inset-bottom))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:700;color:#A99888;padding:4px 0;position:relative}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:2px;background:var(--clay)}
.tabbar .nb{position:absolute;top:0;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--clay)}
/* sheets + toast */
.scrim{position:absolute;inset:0;background:rgba(40,28,20,.35);z-index:40;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 20px 34px;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-d);font-weight:500;font-size:1.7rem;margin:0;line-height:1.1}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;text-align:left;width:100%;font-weight:600;font-size:.9rem}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--sand)}
.opt[disabled]{opacity:.45}
.field{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--sand);border-radius:14px;padding:11px 12px;font-size:.92rem;font-weight:500;color:var(--ink);resize:none}
.gcard{border-radius:22px;padding:20px;background:linear-gradient(140deg,#F2E4D8,#E4CDB9);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.gcard .wm{font-size:1rem}
.gcard .big{font-size:1.9rem}
.gcard::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;border:16px solid rgba(181,119,79,.18)}
.nt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.nt:last-child{border:0}
.nt .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:1rem;background:var(--sand)}
.nt small{display:block;color:var(--muted);font-size:.74rem}
.toast{position:absolute;left:16px;right:16px;bottom:104px;z-index:60;background:var(--ink);color:var(--paper);border-radius:18px;padding:12px 14px;font-size:.86rem;font-weight:600;display:flex;gap:10px;align-items:center;transform:translateY(16px);opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:none;opacity:1}
.tablet .toast{left:auto;right:24px;bottom:24px;width:360px}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- admin panel ---------- */
.adm{display:flex;height:100%;width:100%;container-type:inline-size;background:var(--paper)}
.side-nav{width:220px;flex:none;background:var(--sand);display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line)}
.side-nav .wm{font-size:1.35rem;padding:0 10px 14px}
.side-nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font-weight:600;font-size:.88rem;color:var(--muted);text-align:left;position:relative}
.side-nav button svg{width:20px;height:20px;flex:none}
.side-nav button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 4px 14px -8px rgba(74,52,39,.3)}
.side-nav .cnt{margin-left:auto;font-size:.68rem;background:var(--clay);color:#fff;border-radius:9px;padding:1px 7px}
.side-nav .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;font-size:.82rem}
.side-nav .me small{display:block;color:var(--muted);font-size:.72rem}
.amain{flex:1;min-width:0;overflow-y:auto;padding:26px 30px 30px;display:flex;flex-direction:column;gap:20px;position:relative;scrollbar-width:thin}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ahead .h1{font-size:2.4rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--sand);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-d);font-size:2.3rem;line-height:1;font-weight:500}
.kpi b small{font-family:var(--f-b);font-size:.85rem;color:var(--muted);font-weight:600}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi.warn{background:var(--warn-soft)} .kpi.ok{background:var(--ok-soft)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:.95rem;font-weight:700}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.87rem}
.li:last-child{border:0}
.li .grow{flex:1;min-width:0}
.ck{width:28px;height:28px;border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:transparent;flex:none;background:var(--paper)}
.ck svg{width:15px;height:15px}
.ck[aria-pressed="true"]{background:var(--ok);color:#fff;box-shadow:none}
.feed .li{align-items:flex-start}
.feed .li small{display:block;color:var(--muted);font-size:.74rem}
.fi{width:32px;height:32px;border-radius:10px;background:var(--sand);display:grid;place-items:center;flex:none;font-size:.95rem}
.kan{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--sand);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:320px}
.kcol .kh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:.78rem;font-weight:700}
.kcol .kh small{color:var(--muted);font-weight:600}
.kc{background:var(--paper);border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;text-align:left;width:100%;border:1.5px solid transparent;transition:transform .12s}
.kc:active{transform:scale(.98)}
.kc[aria-pressed="true"]{border-color:var(--clay);background:#FFF9F4}
.kc .ph{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none}
.kc .grow{flex:1;min-width:0}
.kc b{display:block;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc small{display:block;font-size:.72rem;line-height:1.35;color:var(--muted)}
.kc small .sw{vertical-align:-1px;margin-left:2px}
.actionbar .btn{white-space:nowrap}
.actionbar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);border-radius:18px;padding:10px 12px 10px 16px;font-size:.86rem;font-weight:600;box-shadow:0 14px 30px -14px rgba(0,0,0,.5);animation:up .25s}
.kilnv{background:linear-gradient(180deg,#3B2C23,#2A1F19);border-radius:24px;padding:18px;color:var(--paper);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.kilnv.on{box-shadow:inset 0 0 60px rgba(233,140,70,.35)}
.kilnv.on::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 50% 110%,rgba(240,140,60,.45),transparent 70%);animation:breathe 2.5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.shelf{position:relative;z-index:1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px;border-radius:12px;background:rgba(255,255,255,.06);border-bottom:4px solid #6b5546}
.slot{aspect-ratio:1/1;border-radius:50%;background:rgba(255,255,255,.07);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.slot .ph{width:100%;height:100%}
.kilnv .temp{font-family:var(--f-d);font-size:3rem;line-height:1;position:relative;z-index:1}
.kilnv .row{position:relative;z-index:1}
.typeseg{display:inline-flex;background:var(--sand);border-radius:14px;padding:4px;gap:4px}
.typeseg button{padding:8px 12px;border-radius:10px;font-size:.82rem;font-weight:700;color:var(--muted)}
.typeseg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grp{background:var(--sand);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grp b{font-size:.9rem}
.grp .sd{display:flex;gap:5px;flex-wrap:wrap}
.grp .sd i{width:22px;height:22px;border-radius:50%;background:var(--clay);display:grid;place-items:center;color:#fff;font-size:.6rem;font-style:normal;font-weight:700}
.grp .sd i.free{background:transparent;box-shadow:inset 0 0 0 1.5px var(--clay)}
.grp .sd i.rec{background:var(--sage)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border:0}
.tbl .n{font-variant-numeric:tabular-nums}
.meter{display:flex;align-items:center;gap:8px}
.meter .prog{flex:1;min-width:50px}
.prog.sage i{background:var(--sage)}
.bars{display:flex;gap:18px;align-items:flex-end;height:150px;padding-top:10px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bc i{width:100%;max-width:64px;border-radius:12px 12px 4px 4px;background:var(--clay-soft)}
.bars .bc.cur i{background:var(--clay)}
.bars .bc b{font-size:.8rem;font-variant-numeric:tabular-nums}
.bars .bc small{font-size:.72rem;color:var(--muted)}
.wslist .ws{background:var(--sand)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.addrow .field{flex:1;min-width:110px}
.igpost{aspect-ratio:1/1;width:100%;max-width:400px;border-radius:6px;background:#EFE6DB;padding:26px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
.igpost .wm{font-size:.9rem}
.igpost .t{font-family:var(--f-d);font-style:italic;font-size:2.3rem;line-height:1}
.igpost .gl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:.84rem;margin-top:4px}
.igpost .gl b{font-family:var(--f-d);font-size:1.15rem;font-weight:600}
.igpost .ft{margin-top:auto;font-size:.72rem;color:var(--muted)}
.igpost::after{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;background:var(--clay-soft)}
.modal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(40,28,20,.35);animation:fade .2s;padding:20px}
.modal .box{background:var(--paper);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;max-height:100%;overflow:auto}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cpost{background:var(--sand);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.cpost .ph{aspect-ratio:4/3;position:relative}
.cpost .ph .chip{position:absolute;top:8px;left:8px}
.cpost .bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.82rem}
.cpost .rx{display:flex;gap:8px;font-size:.78rem;color:var(--muted);font-weight:700}
@container (max-width:980px){
  .side-nav{width:76px;padding:18px 10px;align-items:center}
  .side-nav .wm{font-size:.9rem;letter-spacing:.2em;padding:0 0 10px}
  .side-nav button{justify-content:center;padding:12px}
  .side-nav button span,.side-nav .me div{display:none}
  .side-nav .cnt{position:absolute;top:4px;right:4px;margin:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols,.cols3{grid-template-columns:1fr}
  .groups{grid-template-columns:repeat(2,1fr)}
  .cgrid{grid-template-columns:repeat(2,1fr)}
  .amain{padding:20px}
}
@container (max-width:560px){
  .side-nav{position:fixed;left:0;right:0;bottom:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px max(8px,env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line);z-index:20}
  .side-nav .wm,.side-nav .me{display:none}
  .amain{padding:16px 16px 90px}
  .kan{grid-template-columns:repeat(5,170px)}
  .cgrid,.groups{grid-template-columns:1fr}
  .tbl .hide-s{display:none}
  .cols3{grid-template-columns:1fr!important}
}

function fit(){

 const portrait=vh>vw;
 const nw=portrait?860:1180, nh=portrait?Math.min(1080,Math.round((vh-bar-40)/ ((vw-40)/(nw+40)) )-40):740;
 if(S.view==='admin'&&!nofr&&(dims.aw!==nw||dims.ah!==Math.max(640,nh))){dims.aw=nw;dims.ah=Math.max(640,nh);render()}
 const dev=$('#device'),wrap=$('#fit');
 if(nofr){wrap.style.width='';wrap.style.height='';dev.style.transform='';return}

  case 'amove':{const ps=S.pieces.filter(p=>S.sel.has(p.id));const to=Math.min(5,ps[0].st+1);const shelves=['B · 1','B · 2','C · 1','C · 2','C · 3','C · 4'];ps.forEach((p,i)=>{p.st=to;if(to===4){p.shelf=shelves[i%6];if(p.o==='ane')notifyAne('🏺',`Zure ${p.eu.toLowerCase()} prest dago · apala ${p.shelf}`,`Lista para recoger: ${p.es} · estante ${p.shelf}`)}});S.sel.clear();soft();toast(to===4?`📲 ${ps.length} ${L('abisu bidalita:','avisos enviados:')} ${[...new Set(ps.map(p=>sname(p.o)))].join(', ')}`:`${ps.length} ${L('pieza →','piezas →')} ${STG[S.lang][to]}`);break}
  case 'kfinish':{if(S.kiln.state!=='run'||S.kiln.anim)break;S.kiln.anim=true;const t=setInterval(()=>{S.kiln.prog=Math.min(1,S.kiln.prog+.08);if(S.kiln.prog>=1){clearInterval(t);S.kiln.state='done';S.kiln.anim=false}if(S.view==='admin'&&S.atab==='kiln')soft()},90);break}
  case 'kopen':{const k=S.kiln,ps=k.load.map(id=>S.pieces.find(p=>p.id===id));const to=k.type==='glaze'?4:1;const sh=['A · 2','A · 3','B · 3','B · 4','C · 1','C · 2'];ps.forEach((p,i)=>{p.st=to;if(to===4){p.shelf=p.shelf||sh[i%6];if(p.o==='ane')notifyAne('🏺',`Zure ${p.eu.toLowerCase()} prest dago · apala ${p.shelf}`,`Lista para recoger: ${p.es} · estante ${p.shelf}`)}else if(p.o==='ane')notifyAne('🎨',`Zure ${p.eu.toLowerCase()} bizkotxoa da: aukeratu esmaltea`,`${p.es}: ya es bizcocho, elige esmalte`)});S.kiln={state:'idle',type:k.type,prog:0,load:[]};S.kSel.clear();soft();toast(`📲 ${ps.length} ${L('abisu bidalita:','avisos enviados:')} ${[...new Set(ps.map(p=>sname(p.o)))].join(', ')}`);break}
  case 'ktype':S.kType=v;S.kSel.clear();soft();break;
  case 'ksel':{const id=+v;S.kSel.has(id)?S.kSel.delete(id):S.kSel.size<18&&S.kSel.add(id);soft();break}
  case 'kstart':{const ids=[...S.kSel];if(!ids.length)break;if(S.kType==='glaze')ids.forEach(id=>S.pieces.find(p=>p.id===id).st=3);S.kiln={state:'run',type:S.kType,prog:.03,load:ids};S.kSel.clear();soft();toast('🔥 '+L('Labea piztuta · ikasleek mugikorrean ikusten dute','Horno encendido · las alumnas lo ven en el móvil'));break}
  case 'remind':S.reminded.add(v);soft();toast('📨 '+L(`Gogorarazpena bidalita ${sname(v)}ri`,`Recordatorio enviado a ${sname(v)}`));break;
  case 'star':S.posts.forEach(p=>p.star=p.id===+v);soft();toast('⭐ '+L('Asteko pieza aldatuta · ikasle guztiek ikusiko dute','Pieza de la semana cambiada · la verán todas'));break;
  case 'amodal':S.modal=v;soft();break;
  case 'mclose':if(e.target.closest('[data-stop]')&&b.dataset.act!=='mclose'&&!e.target.closest('#m-close'))break;if(e.target.closest('.box')&&!e.target.closest('#m-close'))break;S.modal=null;soft();break;
  case 'igdl':toast('✓ '+L('Irudia prest (demoa)','Imagen lista (demo)'));break;
 }
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
 if(f.dataset.form==='cmt'){const inp=f.querySelector('input');const t=inp.value.trim();if(!t)return;S.posts.find(x=>x.id===+f.dataset.v).c.push(['ane',t]);soft();toast('💬 '+L('Iruzkina bidalita','Comentario enviado'))}
 if(f.dataset.form==='addws'){const d=+$('#w-d').value,h=$('#w-h').value||'18:00',c=+$('#w-c').value||6;if(!d||d<1||d>31)return;const dt=new Date(2026,9,d).getDay();const dwE=['Ig','Al','Ar','Az','Og','Or','Lr'][dt],dwS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][dt];S.workshops.push({id:Date.now(),d,dw:{eu:dwE,es:dwS},h,eu:'Sortu zure pieza',es:'Crea tu pieza',cap:c,b:0,p:65});S.workshops.sort((a,b)=>a.d-b.d);soft();toast('✓ '+L(`Urriak ${d} gehituta · ikasleen app-ean dago jada`,`${d} de octubre añadido · ya está en la app de alumnas`))}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k){S.sheetData[k]=e.target.value;if(S.sheet==='gift'){const c=$('.gcard');if(c){const tmp=S.sheetData;c.querySelectorAll('div')[1].innerHTML=`${L('Norentzat','Para')}: <b>${esc(tmp.to||'Miren')}</b>`;c.querySelectorAll('div')[2].textContent=`“${tmp.msg||L('Zorionak! Buztina zikintzeko ordua da 🤎','¡Felicidades! Toca mancharse las manos 🤎')}”`}}}});
function readImg(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=900,sc=Math.min(1,m/Math.max(im.width,im.height));c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)}
$('#up-post').addEventListener('change',e=>{readImg(e.target.files[0],url=>{S.sheet='compose';S.sheetData={img:url};if(S.view!=='app'){S.view='app'}soft()});e.target.value=''});
$('#up-piece').addEventListener('change',e=>{readImg(e.target.files[0],url=>{const p=S.pieces.find(x=>x.id===S.detail);if(p){p.photo=url;soft();toast('📷 '+L('Argazkia gordeta','Foto guardada'))}});e.target.value=''});
function doTry(k){
 S.sheet=null;S.sheetData={};S.detail=null;
 if(k==='ready'){S.tab='home';let p=mine().find(x=>x.st===4);if(!p){p=S.pieces.find(x=>x.id===1);p.st=4}S.detail=p.id;render();confetti()}
 else if(k==='cant'){S.tab='home';S.ane={freed:true,rec:null};S.sheet='recover';render()}
 else if(k==='glaze'){let p=mine().find(x=>x.st===1&&!x.g);if(!p){p=S.pieces.find(x=>x.id===3);p.st=1;p.g=null}S.detail=p.id;render();const sc=$('#abody');if(sc)sc.scrollTop=250}
 else if(k==='txoko'){S.tab='txoko';render();$('#up-post').click()}
 else if(k==='react'){S.tab='txoko';S.sheetData={openC:S.posts[0].id};render()}
 else if(k==='gift'){S.tab='cal';S.sheet='gift';render()}
 else if(k==='me'){S.tab='me';render()}
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fit,80)});
render();fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
setTimeout(()=>{if(S.view==='app'&&S.tab==='home')confetti()},700);
</script>
