<style>
/* ============================================================
   Nare Pilates Studio · maqueta de propuesta (Ondora Studio)
   Tokens compartidos por la demo móvil (alumnas.html) y el panel (panel.html).
   v2 · «esencia de estudio»: crema y lino, oliva profundo, arcilla.
   Fuentes: Fraunces (display) + Figtree (UI), cargadas desde fonts-nare.css.
   ============================================================ */

:root {
  /* superficie y texto (tema claro) */
  --bg: #F4EFE8;             /* lino */
  --surface: #FFFCF8;        /* crema */
  --surface-2: #ECE4DA;      /* arena */
  --ink: #2B2622;            /* carbón cálido */
  --text: #57514A;
  --muted: #8B8379;
  --line: #E6DED3;
  --line-strong: #D2C7B9;

  /* marca */
  --primary: #46584A;        /* oliva profundo */
  --primary-ink: #FBF7F1;
  --primary-soft: #E3E8E1;
  --accent: #C8896A;         /* arcilla */
  --accent-ink: #2B2622;
  --accent-soft: #F4E4D9;
  --side: #2F3D34;           /* lateral del panel (fijo en los dos temas) */
  --side-ink: #FBF7F1;

  /* semántica (independiente del acento) */
  --ok: #4F8A6A;   --ok-soft: #E2EFE7;
  --warn: #B9742A; --warn-soft: #F6E8D6;
  --danger: #B5473F; --danger-soft: #F6E1DF;
  --info: #5C7A8C; --info-soft: #E3ECF1;

  /* tipografía */
  --font-display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-ui: 'Figtree', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;

  /* forma */
  --radius-s: 12px;
  --radius: 18px;
  --radius-l: 26px;
  --shadow: 0 1px 2px rgba(43, 38, 34, .05), 0 14px 36px -18px rgba(43, 38, 34, .32);
  --shadow-s: 0 1px 2px rgba(43, 38, 34, .08);
  --focus: 0 0 0 3px rgba(200, 137, 106, .5);
  --photo-tint: rgba(196, 150, 110, .12);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1917; --surface: #242220; --surface-2: #2E2B27;
    --ink: #F1ECE4; --text: #CFC7BC; --muted: #948C82;
    --line: #35312C; --line-strong: #47423B;
    --primary: #A6B8A6; --primary-ink: #14201A; --primary-soft: #2B352E;
    --accent: #D8A283; --accent-ink: #2B2622; --accent-soft: #3D2E24;
    --side: #1F2925; --side-ink: #FBF7F1;
    --ok: #7FBB98; --ok-soft: #1F3A2D;
    --warn: #E0A55C; --warn-soft: #3E2E17;
    --danger: #E08079; --danger-soft: #3F2321;
    --info: #8DB0C4; --info-soft: #1F3340;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 36px -18px rgba(0, 0, 0, .6);
    --shadow-s: 0 1px 2px rgba(0, 0, 0, .4);
    --focus: 0 0 0 3px rgba(216, 162, 131, .5);
    --photo-tint: rgba(0, 0, 0, .18);
  }
}
:root[data-theme="dark"] {
  --bg: #1B1917; --surface: #242220; --surface-2: #2E2B27;
  --ink: #F1ECE4; --text: #CFC7BC; --muted: #948C82;
  --line: #35312C; --line-strong: #47423B;
  --primary: #A6B8A6; --primary-ink: #14201A; --primary-soft: #2B352E;
  --accent: #D8A283; --accent-ink: #2B2622; --accent-soft: #3D2E24;
  --side: #1F2925; --side-ink: #FBF7F1;
  --ok: #7FBB98; --ok-soft: #1F3A2D;
  --warn: #E0A55C; --warn-soft: #3E2E17;
  --danger: #E08079; --danger-soft: #3F2321;
  --info: #8DB0C4; --info-soft: #1F3340;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 36px -18px rgba(0, 0, 0, .6);
  --shadow-s: 0 1px 2px rgba(0, 0, 0, .4);
  --focus: 0 0 0 3px rgba(216, 162, 131, .5);
  --photo-tint: rgba(0, 0, 0, .18);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; color: var(--ink); line-height: 1.12; text-wrap: balance; }
h1, h2, .display { font-family: var(--font-display); font-weight: 400; letter-spacing: -.012em; font-variation-settings: 'opsz' 96, 'SOFT' 60, 'WONK' 0; }
h1 em, h2 em, .display em { font-style: italic; font-weight: 300; color: inherit; }
h3, h4 { font-family: var(--font-ui); font-weight: 700; }
p { margin: 0; }
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; display: block; }
.num, .tabular { font-variant-numeric: tabular-nums; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--radius-s); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- cinta de maqueta (igual que en las demos de Ondora) ---------- */
.ribbon {
  background: var(--ink); color: var(--bg);
  font: 500 12px/1.4 var(--font-ui); letter-spacing: .03em;
  padding: 8px 16px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; text-align: center;
}
.ribbon-tag { background: var(--accent); color: var(--accent-ink); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; }
.ribbon a { color: inherit; }

/* ---------- botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border-radius: 999px;
  border: 1.5px solid transparent; background: var(--surface-2); color: var(--ink);
  font-weight: 700; font-size: 15px; line-height: 1.2; cursor: pointer; text-decoration: none; letter-spacing: .005em;
  transition: background .15s ease, transform .05s ease, box-shadow .15s ease, border-color .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 10px 22px -14px rgba(70, 88, 74, .9); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-accent { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 22px -14px rgba(200, 137, 106, .9); }
.btn-outline { background: rgba(255, 252, 248, .55); border-color: var(--line-strong); color: var(--ink); }
.btn-outline:hover { border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--primary); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 6px 14px; font-size: 13.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ---------- estados (pills) ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill-esperando   { background: var(--info-soft);   color: var(--info); }
.pill-avisada     { background: var(--warn-soft);   color: var(--warn); }
.pill-confirmada  { background: var(--ok-soft);     color: var(--ok); }
.pill-incorporada { background: var(--primary-soft); color: var(--primary); }
.pill-sinrespuesta{ background: var(--surface-2);   color: var(--muted); }
.pill-descartada  { background: var(--danger-soft); color: var(--danger); }
.pill-libre       { background: var(--ok-soft);     color: var(--ok); }
.pill-completo    { background: var(--surface-2);   color: var(--muted); }
.pill-nueva       { background: var(--accent-soft); color: #8F5A3A; }
:root[data-theme="dark"] .pill-nueva { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill-nueva { color: var(--accent); } }

/* ---------- tarjetas y formularios ---------- */
.card { background: var(--surface); border: 1px solid rgba(43, 38, 34, .06); border-radius: var(--radius); padding: 18px; box-shadow: 0 1px 2px rgba(43, 38, 34, .03), 0 10px 30px -22px rgba(43, 38, 34, .25); }
.card-lift { box-shadow: var(--shadow); border-color: transparent; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; color: var(--ink); }
.field .hint { font-size: 13px; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 48px; padding: 10px 16px; border-radius: 14px;
  border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink);
}
.textarea { min-height: 90px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; user-select: none; }
.chip[aria-pressed="true"], .chip.is-on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chip input { position: absolute; opacity: 0; pointer-events: none; }

/* ---------- avisos en línea ---------- */
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; font-size: 14px; }
.notice-ok { background: var(--ok-soft); color: var(--ok); }
.notice-warn { background: var(--warn-soft); color: var(--warn); }
.notice-info { background: var(--info-soft); color: var(--info); }
.notice-danger { background: var(--danger-soft); color: var(--danger); }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); z-index: 1000; max-width: min(92vw, 420px); text-align: center; }

</style>
<style>
/* ===== Panel «Plazas» · Nare Pilates Studio · maqueta de Ondora Studio ===== */
html, body { min-height: 100%; }
body { overflow-x: hidden; }
#app, #app * { min-width: 0; }
:root { --ribbon-h: 52px; }
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - var(--ribbon-h)); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---- cinta y menú Demo ---- */
.ribbon { justify-content: flex-start; position: relative; z-index: 300; }
.ribbon .ribbon-text { flex: 1 1 auto; text-align: left; }
.demo-menu { position: relative; margin-left: auto; }
.demo-menu > .btn { color: var(--bg); border-color: rgba(255,255,255,.4); }
.demo-drop { display: none; position: absolute; right: 0; top: 40px; background: var(--surface); color: var(--text); text-align: left; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); width: 320px; padding: 8px; letter-spacing: 0; font-size: 14px; }
.demo-drop.is-open { display: block; }
.demo-drop button.item, .demo-drop label.item { width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none; border-radius: var(--radius-s); cursor: pointer; min-height: 44px; font-weight: 600; color: var(--ink); display: flex; gap: 10px; align-items: center; font-size: 14px; }
.demo-drop button.item:hover, .demo-drop label.item:hover { background: var(--surface-2); }
.demo-drop .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.demo-drop .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; font-weight: 600; color: var(--ink); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); min-height: 32px; }
.seg button.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-s); }
.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line-strong); border: 0; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-s); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch-row .hint { font-size: 13px; color: var(--muted); }

/* ---- menú lateral ---- */
.sidenav { position: sticky; top: 0; height: calc(100vh - var(--ribbon-h)); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px 16px; gap: 2px; }
.logo { font-family: var(--font-display); font-size: 30px; font-weight: 500; color: var(--ink); padding: 0 12px 18px; letter-spacing: -.01em; line-height: 1; }
.logo small { display: block; font: 700 11px/1.4 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.navitem { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-s); color: var(--text); font-weight: 600; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; min-height: 44px; font-size: 15px; }
.navitem:hover { background: var(--surface-2); }
.navitem.is-active { background: var(--primary-soft); color: var(--primary); }
.badge { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 800; min-width: 22px; height: 22px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; padding: 0 7px; font-variant-numeric: tabular-nums; }
.sidenav-foot { margin-top: auto; font-size: 12.5px; color: var(--muted); padding: 12px 12px 0; line-height: 1.5; border-top: 1px solid var(--line); }
.sidenav-foot strong { color: var(--ink); display: block; }

/* ---- cabecera y vista ---- */
.main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 22px 32px 8px; flex-wrap: wrap; }
.topbar h1 { font-size: 32px; }
.topbar .date { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.search { margin-left: auto; position: relative; width: min(380px, 42%); }
.search .input { min-height: 42px; padding-left: 40px; }
.search .icon { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.search-results { display: none; position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); box-shadow: var(--shadow); z-index: 50; max-height: 320px; overflow: auto; padding: 6px; }
.search-results.is-open { display: block; }
.search-results button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: var(--radius-s); cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 44px; color: var(--ink); font-weight: 600; }
.search-results button:hover { background: var(--surface-2); }
.search-results .muted { font-weight: 500; font-size: 13px; }
.who { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-family: var(--font-display); font-size: 18px; }
.view { padding: 8px 32px 56px; display: grid; gap: 22px; max-width: 1200px; align-content: start; }
.lead { font-size: 18.5px; color: var(--ink); line-height: 1.4; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-h h2 { font-size: 23px; }
.section-h h3 { font-size: 16px; }
.sub { font-size: 14px; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.stack-s { display: grid; gap: 6px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; text-align: left; }
.stat:hover { border-color: var(--line-strong); }
.stat .n { font-family: var(--font-display); font-size: 42px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13.5px; color: var(--muted); font-weight: 600; margin-top: 8px; }
.notice, .notice-ok, .notice-warn, .notice-info, .notice-danger { color: var(--ink); }
.notice { align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; border-left: 3px solid var(--line-strong); }
.notice-ok { border-left-color: var(--ok); }
.notice-warn { border-left-color: var(--warn); }
.notice-info { border-left-color: var(--info); }
.notice-danger { border-left-color: var(--danger); }
.alerts { display: grid; gap: 8px; }
.alerts:empty { display: none; }
.notice .grow { flex: 1 1 280px; }
.notice .btn { flex: none; }
.notice .btn-sm { background: var(--surface); color: var(--ink); }
.notice-ok .btn-primary, .notice-warn .btn-primary, .notice-info .btn-primary { background: var(--primary); color: var(--primary-ink); }
.notice-danger .btn-primary { background: var(--danger); color: #fff; }
.banner { position: sticky; top: 8px; z-index: 20; box-shadow: var(--shadow); }
.card h3 { font-size: 16.5px; }
.card .title-row { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.mini { display: grid; gap: 6px; cursor: pointer; }
.mini .n { font-family: var(--font-display); font-size: 26px; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
.demand { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.demand:last-child { border-bottom: 0; }
.demand strong { color: var(--ink); }

/* ---- tablas ---- */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 12px; overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); font-weight: 700; }
.table td { padding: 11px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table td strong, .table td .name { color: var(--ink); }
.table .td-actions { text-align: right; }
.table .td-actions .btn { margin: 2px 0 2px 4px; white-space: nowrap; }
.table tr.is-tachada .name { text-decoration: line-through; }
.table tr.is-tachada td { color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.tag.tag-ok { color: var(--ok); background: var(--ok-soft); }
.tag.tag-warn { color: var(--warn); background: var(--warn-soft); }
.tag.tag-danger { color: var(--danger); background: var(--danger-soft); }
.chip.is-libre { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.chip.is-gris { color: var(--muted); }
.chip.chip-s { min-height: 30px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; cursor: default; white-space: nowrap; }
.link-btn { background: none; border: 0; color: var(--primary); font-weight: 700; cursor: pointer; padding: 6px 4px; min-height: 36px; }
.link-btn.danger { color: var(--danger); }
.icon-btn { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 6px; border-radius: var(--radius-s); min-width: 36px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---- candidatas ---- */
.cand { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
.cand:last-child { border-bottom: 0; }
.cand .num-big { font-family: var(--font-display); font-size: 26px; color: var(--muted); line-height: 1.1; font-variant-numeric: tabular-nums; }
.cand .name { font-weight: 700; color: var(--ink); font-size: 16px; }
.cand .meta { font-size: 14px; color: var(--text); margin-top: 3px; }
.cand .encaja { font-size: 14px; color: var(--ink); margin-top: 6px; }
.cand.is-gris { opacity: .72; }
.cand.is-gris .num-big { visibility: hidden; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.cand .actions { flex-direction: column; align-items: stretch; }
.status-line { font-size: 13.5px; color: var(--muted); margin-top: 6px; }

/* ---- parrilla semanal ---- */
.grid-horarios { display: grid; grid-template-columns: 64px repeat(5, 1fr); gap: 6px; }
.gh-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; padding: 6px 0; }
.gh-hour { font-size: 13px; font-weight: 700; color: var(--muted); padding: 10px 0; font-variant-numeric: tabular-nums; }
.gh-cell { min-height: 60px; border-radius: var(--radius-s); padding: 8px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--surface-2); color: var(--ink); border: 0; text-align: left; width: 100%; line-height: 1.35; }
.gh-cell.is-libre { background: var(--ok-soft); color: var(--ok); }
.gh-cell.is-ofrecida { background: var(--accent-soft); color: var(--ink); }
.gh-cell.is-empty { background: transparent; cursor: default; }
.day-list { display: none; gap: 10px; }
.day-list h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 0 2px; }

/* ---- pestañas y filtros ---- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 10px 14px; border: 0; background: none; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; min-height: 44px; white-space: nowrap; font-size: 14.5px; }
.tab.is-active { color: var(--primary); border-bottom-color: var(--primary); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters .select, .filters .input { width: auto; min-height: 40px; padding: 6px 12px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--primary); }
.radio { display: flex; align-items: start; gap: 10px; padding: 8px 0; cursor: pointer; }
.radio input { width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.avail-grid { display: grid; grid-template-columns: 64px repeat(5, 1fr); gap: 6px; }
.avail-grid .lbl { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; }
.avail-grid .chip { justify-content: center; padding: 6px; min-height: 40px; }
.vars { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.vars code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; color: var(--ink); }
.msg-box { font-size: 14px; white-space: pre-wrap; background: var(--surface-2); border-radius: var(--radius-s); padding: 12px 14px; color: var(--ink); overflow-wrap: anywhere; }
.hist li { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.hist { list-style: none; padding: 0; margin: 0; }
details summary { cursor: pointer; font-weight: 700; color: var(--primary); padding: 8px 0; min-height: 44px; display: flex; align-items: center; }
.ajustes-table input { min-height: 38px; padding: 4px 8px; }
.ajustes-table .input, .ajustes-table .select { min-height: 38px; padding: 4px 8px; }

/* ---- modales, hojas, cajón, toast ---- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(27,42,49,.5); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--surface); border-radius: var(--radius-l); width: min(580px, 100%); max-height: calc(100vh - 40px); overflow: auto; box-shadow: var(--shadow); padding: 26px; display: grid; gap: 14px; align-content: start; }
.modal.modal-wide { width: min(720px, 100%); }
.modal h2 { font-size: 23px; }
.modal .sub { font-size: 14.5px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.modal-actions .spacer { flex: 1; }
.drawer-backdrop { position: fixed; inset: 0; background: rgba(27,42,49,.35); z-index: 380; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); box-shadow: var(--shadow); z-index: 390; overflow: auto; padding: 24px; display: grid; gap: 14px; align-content: start; }
.drawer h2 { font-size: 22px; }
.close-x { position: absolute; top: 14px; right: 14px; }
.toast { display: flex; gap: 12px; align-items: center; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 800; cursor: pointer; padding: 4px 6px; }
.tabbar { display: none; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.danger-text { color: var(--danger); }
.ok-text { color: var(--ok); }
.tt { position: relative; }

/* ---- 768–1023: menú lateral con iconos ---- */
@media (max-width: 1023px) {
  .app { grid-template-columns: 76px minmax(0, 1fr); }
  .sidenav { padding: 18px 10px 12px; }
  .navitem .txt, .sidenav-foot, .logo small { display: none; }
  .logo { font-size: 22px; text-align: center; padding: 0 0 14px; }
  .navitem { justify-content: center; position: relative; padding: 10px; }
  .badge { position: absolute; top: 3px; right: 6px; margin: 0; min-width: 18px; height: 18px; font-size: 11px; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(3, 1fr); }
  .topbar, .view { padding-left: 22px; padding-right: 22px; }
  .search { width: min(300px, 34%); }
  .topbar h1 { font-size: 27px; }
  .table th, .table td { padding-left: 6px; padding-right: 6px; }
}

/* ---- < 768: barra inferior, una columna, tarjetas ---- */
@media (max-width: 767px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-bottom: 76px; }
  .sidenav { display: none; }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar button { flex: 1; min-height: 62px; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; border: 0; background: none; color: var(--muted); position: relative; padding: 6px 2px; }
  .tabbar button.is-active { color: var(--primary); }
  .tabbar .badge { position: absolute; top: 6px; right: calc(50% - 22px); margin: 0; min-width: 18px; height: 18px; font-size: 11px; }
  .ribbon { padding: 6px 12px; font-size: 10.5px; gap: 8px; flex-wrap: nowrap; line-height: 1.3; }
  .ribbon .ribbon-tag { font-size: 9.5px; padding: 3px 8px; }
  .demo-menu > .btn { min-height: 32px; padding: 4px 10px; font-size: 12.5px; }
  .demo-drop { position: fixed; left: 12px; right: 12px; top: 52px; width: auto; }
  .stats > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .topbar { padding: 14px 16px 4px; gap: 10px; }
  .topbar h1 { font-size: 26px; }
  .search { width: 100%; margin: 0; order: 3; }
  .who .name { display: none; }
  .view { padding: 6px 16px 32px; gap: 16px; }
  .lead { font-size: 16.5px; }
  .stats, .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
  .stat { padding: 12px 14px; }
  .stat .n { font-size: 34px; }
  .table-wrap { background: transparent; border: 0; padding: 0; }
  .table, .table tbody, .table tr, .table td { display: block; }
  .table thead { display: none; }
  .table tr { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 0 0 10px; background: var(--surface); }
  .table td { border: 0; padding: 5px 0; display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 8px; align-items: start; }
  .table td::before { content: attr(data-label); font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; }
  .table td.td-actions { grid-template-columns: 1fr; text-align: left; white-space: normal; padding-top: 10px; }
  .table td.td-actions::before { display: none; }
  .table td.td-actions .btn { margin: 0 6px 6px 0; }
  .cand { grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
  .cand .actions { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; min-width: 0; }
  .cand .actions .btn { flex: 1 1 auto; }
  .grid-horarios { display: none; }
  .day-list { display: grid; }
  .modal-backdrop { padding: 0; align-items: stretch; }
  .modal, .modal.modal-wide { width: 100%; max-height: none; border-radius: 0; min-height: 100vh; padding: 20px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .modal-actions .btn { flex: 1 1 45%; }
  .drawer { width: 100%; padding: 20px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .field-row { grid-template-columns: 1fr; }
  .demand { grid-template-columns: 1fr; }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 768px) { .day-list { display: none; } }

/* ============================================================
   v2 · esencia de estudio: lateral oliva, cabecera con fotografía, lino
   ============================================================ */
.sidenav { background: var(--side); border-right: 0; color: rgba(251, 247, 241, .82); padding: 24px 14px 18px; }
.logo { color: var(--side-ink); font-weight: 300; font-style: italic; font-size: 34px; font-variation-settings: 'opsz' 96, 'SOFT' 80; }
.logo small { color: rgba(251, 247, 241, .55); }
.navitem { color: rgba(251, 247, 241, .78); border-radius: 14px; }
.navitem:hover { background: rgba(255, 255, 255, .08); color: var(--side-ink); }

function historialPersona(p) {

  si.addEventListener('input', () => { const t = si.value.trim().toLowerCase(); if (t.length < 2) { sr.classList.remove('is-open'); sr.innerHTML = ''; return; } const al = S.alumnas.filter(a => a.nombre.toLowerCase().includes(t)).slice(0, 6); const es = S.listaEspera.filter(p => p.nombre.toLowerCase().includes(t)).slice(0, 6); sr.innerHTML = al.map(a => `<button type="button" data-act="ficha" data-a="${a.id}">${icon('users')}<span>${esc(a.nombre)}</span><span class="muted">Alumna · ${esc(G(a.grupo) ? G(a.grupo).corto : '')}</span></button>`).concat(es.map(p => `<button type="button" data-act="ver" data-p="${p.id}">${icon('list')}<span>${esc(p.nombre)}</span><span class="muted">${esc(cap(p.estado))} · ${esc(esperandoDesdeTexto(p))}</span></button>`)).join('') || '<div class="empty">Nadie con ese nombre.</div>'; sr.classList.add('is-open'); });
  si.addEventListener('keydown', e => { if (e.key === 'Escape') { sr.classList.remove('is-open'); si.value = ''; } });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) sr.classList.remove('is-open'); if (e.target.closest('#search-results [data-act]')) { sr.classList.remove('is-open'); si.value = ''; } });
  const map = { p1: 'p1', p2: 'p2', p3: 'p3', p3b: 'p3b', p4: 'p4', 'p4-modal': 'p4', p5: 'p5', p6: 'p6', p7: 'p7', p8: 'p8' };
  view.screen = map[screen] || 'p1';
  if (view.screen === 'p3b' || view.screen === 'p4') view.grupo = q.get('grupo') || 'g-mj-1830';
  render();
  if (screen === 'p4-modal') { const p = P('w1'), g = G(view.grupo); if (p && g) avisarModal(p, g); }
}
init();
</script>
